{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DISTRICARNES - Contacto</title>
    <link rel="stylesheet" href="{% static 'css/productos.css' %}">
    <link rel="shortcut icon" href="{% static '/images/LOGO-DISTRICARNES.ico' %}" type="image/x-icon">
</head>
<body>
    {% include "APP_DISTRICARNES/partials/contacto.html" %}

    <!-- Formulario de contacto -->
  <section class="max-w-7xl mx-auto px-6 mb-20">
   <h4 class="text-red-600 font-bold text-center mb-4"  style="font-size: 2rem;" >
    CONTÁCTANOS
   </h4>
   <p class="text-gray-400 text-center text-xs mb-6">
    Déjanos tu mensaje y te responderemos a la brevedad
   </p>
   <form class="max-w-md mx-auto space-y-6">
    <div>
     <label class="block text-gray-400 text-xs mb-1" for="nombre">
      Nombre Completo
     </label>
     <input class="w-full rounded-md bg-gray-700 text-white px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600" id="nombre" name="nombre" placeholder="Escribe aquí" type="text"/>
    </div>
    <div>
     <label class="block text-gray-400 text-xs mb-1" for="email">
      Correo Electrónico
     </label>
     <input class="w-full rounded-md bg-gray-700 text-white px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600" id="email" name="email" placeholder="correo@ejemplo.com" type="email"/>
    </div>
    <div>
     <label class="block text-gray-400 text-xs mb-1" for="mensaje">
      Mensaje
     </label>
     <textarea class="w-full rounded-md bg-gray-700 text-white px-3 py-2 text-sm placeholder-gray-400 resize-none focus:outline-none focus:ring-2 focus:ring-red-600" id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí." rows="5"></textarea>
    </div>
    <div class="text-center">
     <button class="bg-red-700 hover:bg-red-800 transition text-white font-semibold px-6 py-2 rounded" type="submit">
      Enviar
     </button>
    </div>
   </form>
  </section>
</body>
</html>
