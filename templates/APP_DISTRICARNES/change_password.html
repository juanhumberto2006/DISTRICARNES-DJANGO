{% extends "APP_DISTRICARNES/base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6 mt-10 text-gray-800">
  <h2 class="text-2xl font-bold text-red-700 mb-4">🔑 Cambiar Contraseña</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-semibold px-4 py-2 rounded">
      Actualizar Contraseña
    </button>
  </form>
</div>
{% endblock %}
