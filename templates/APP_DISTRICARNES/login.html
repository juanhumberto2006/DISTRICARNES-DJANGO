{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISTRICARNES - Login</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="shortcut icon" href="{% static 'images/LOGO-DISTRICARNES.ico' %}" type="image/x-icon">
</head>
<body>
  <div class="container" role="main">
    <section class="logo-section" aria-label="Logotipo de DistriCarnes Hermanos Navarro">
      <div class="logo-container">
        <img src="{% static 'images/LOGO-DISTRICARNES.png' %}" style="width: 100%; height: auto;" alt="imagen de logo DISTRICARNES">
      </div>
    </section>

    <section class="form-section" aria-label="Formulario de inicio de sesión de DistriCarnes">
<div id="messageContainer" class="message-container"></div>

<style>
.message-container {
  width: 100%;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 8px;
  display: none;
}

.success-message {
  background-color: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}

.error-message {
  background-color: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}

.message-container.show {
  display: block;
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const loginForm = document.getElementById('loginForm');
  const messageContainer = document.getElementById('messageContainer');

  loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    try {
      const response = await fetch(window.location.pathname, {
        method: 'POST',
        body: formData,
        headers: {
          'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
          'X-Requested-With': 'XMLHttpRequest'
        },
        credentials: 'same-origin'
      });

      if (response.redirected) {
        // If redirected, login was successful
        messageContainer.className = 'message-container success-message show';
        messageContainer.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
        
        setTimeout(() => {
          window.location.href = response.url;
        }, 1500);
        return;
      }

      const data = await response.text();
      
      // Check if the response contains a Django error message
      if (data.includes('errorlist') || !response.ok) {
        messageContainer.className = 'message-container error-message show';
        messageContainer.textContent = 'Credenciales incorrectas. Por favor verifique su usuario y contraseña e intente nuevamente.';
        document.getElementById('password').value = '';
      } else {
        // If no error message and not redirected, submit the form normally
        loginForm.submit();
      }
      
    } catch (error) {
      console.error('Error:', error);
      messageContainer.className = 'message-container error-message show';
      messageContainer.textContent = 'Error al intentar iniciar sesión. Por favor intente nuevamente.';
    }
  });
});
</script>
      <form method="POST" novalidate id="loginForm">
        {% csrf_token %}

      <div class="input-container">
        <input type="hidden" id="redirectField" name="redirect" value="">
        <input type="hidden" id="adminField" name="admin" value="0">

       
        
        <label for="email">Correo electronico</label><br>
<input type="email" 
       name="{{ form.username.name }}" 
       id="{{ form.username.id_for_label }}" 
       class="form-input" 
       placeholder="Email-Usuario"
       autocomplete="email"
       required
       aria-label="Correo electrónico"
       {% if form.username.value %}value="{{ form.username.value }}"{% endif %}
       style="width: 100%;
      padding: 10px 14px;
      border-radius: 15px;
      border: none;
      background-color: #979292cc;
      color: white;
      font-style: italic;
      font-size: 1rem;
      outline: none;">
      </div>
      <br>

        <label for="password">Contraseña</label>
        <div class="input-container">
<input type="password" 
       name="{{ form.password.name }}"
       id="{{ form.password.id_for_label }}"
       class="form-input"
       placeholder="Contraseña"
       required
       aria-label="Contraseña"
       {% if form.password.value %}value="{{ form.password.value }}"{% endif %}
       style="width: 100%;
              padding: 10px 14px;
              border-radius: 15px;
              border: none;
              background-color: #979292cc;
              color: white;
              font-style: italic;
              font-size: 1rem;
              outline: none;">
          <svg id="togglePassword1" class="toggle-password" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <title>Mostrar/Ocultar contraseña</title>
            <path d="M12 4.5c-7.44 0-9.476 6-9.476 6s2.037 6 9.476 6 9.476-6 9.476-6-2.036-6-9.476-6zm0 10.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" fill="none" stroke="white" stroke-width="1.75" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="2.5" fill="none" stroke="white" stroke-width="1.75" />
          </svg>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="terms" name="terms" aria-required="true" />
          <label for="terms" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <span class="custom-checkbox" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" fill="none" />
              </svg>
            </span>
            Aceptar terminos y condiciones
          </label>
        </div>

        <button type="submit" class="btn-login" aria-label="Iniciar sesión">INICIAR SESION</button>
      </form>

      <div style="text-align: center; margin-top:10px;">
        <a href="{% url 'admin:index' %}" class="btn-login" style="display:block; text-align:center; text-decoration:none; background-color:#2c3e50; font-size:0.9em; padding:8px; width:80%; margin-left:auto; margin-right:auto;">Acceso Administrador</a>
      </div>

      <p class="register-prompt" aria-live="polite">
        ¿Aun no estas registrado? <strong tabindex="0"><a href="{% url 'register' %}">Registrarse</a></strong>
      </p>
    </section>
  </div>

  <script>
    const togglePassword1 = document.getElementById('togglePassword1');
    const passwordInput1 = document.getElementById('password');
    if (togglePassword1 && passwordInput1) {
      togglePassword1.addEventListener('click', () => {
        const type = passwordInput1.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput1.setAttribute('type', type);
        togglePassword1.style.opacity = type === 'text' ? '1' : '0.7';
      });
    }
  </script>
</body>
</html>
